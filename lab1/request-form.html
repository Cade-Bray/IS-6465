<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Peer Tutoring Hub - Request a Session</title>
    <!-- Bootstrap 5.3 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link rel="stylesheet" href="css/styles.css">
</head>

<body class="d-flex flex-column min-vh-100">
    <!-- Nav bar start-->
    <header>
        <!-- I am ultizing a nav element with a list of anchor tags so they can be grouped easier for screenreaders-->
        <nav class="navbar navbar-expand-lg navbar-dark bg-success shadow-sm" aria-label="Main Navigation">
            <div class="container">
                <a class="navbar-brand fw-bold" href="index.html">Peer Tutoring Hub</a>
                <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#mainNavbar"
                    aria-controls="mainNavbar" aria-expanded="false" aria-label="Toggle navigation">
                    <span class="navbar-toggler-icon"></span>
                </button>
                <div class="collapse navbar-collapse" id="mainNavbar">
                    <ul class="navbar-nav ms-auto mb-2 mb-lg-0">
                        <li class="nav-item">
                            <a class="nav-link active" href="index.html">Home</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="tutors.html">View Available Tutors</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" aria-current="page" href="request-form.html">Request a Tutoring
                                Session</a>
                        </li>
                    </ul>
                </div>
            </div>
        </nav>
    </header>
    <!-- Nav Bar ends-->

    <!-- main page area-->
    <main class="container my-auto py-5 flex-grow-1">
        <div class="row justify-content-center">
            <!-- columns are defined for large and medium screens -->
            <div class="col-lg-8 col-md-10">
                <!-- Utilizing a card element to contain the content -->
                <div class="card shadow-sm border-0 rounded-4 p-4 p-md-5">
                    <h1 class="h2 fw-bold text-dark mb-2">Request a Tutoring Session</h1>
                    <p class="text-secondary mb-4">Fill out the form below to schedule a one-on-one session with a peer
                        tutor.</p>

                    <form action="process-request.php" method="post">
                        <div class="mb-3">
                            <label for="course" class="form-label fw-semibold text-dark">Course</label>
                            <!-- Used this class as a placeholder -->
                            <input type="text" id="course" name="course" class="form-control form-control-lg"
                                placeholder="e.g. IS 6465" required>
                        </div>

                        <div class="mb-4">
                            <label for="date" class="form-label fw-semibold text-dark">Preferred Date</label>
                            <!-- 
                                I initially tried to use the select element for the date, but it would not display 
                                the calendar UI element to select the date. I instead used the 
                                input type="date" element to display the calendar UI element to select the date. 
                            -->
                            <input type="date" id="date" name="date" class="form-control form-control-lg" required>
                        </div>

                        <div class="d-flex flex-wrap gap-3 justify-content-between align-items-center pt-3">
                            <a href="tutors.html" class="btn btn-outline-success btn-lg px-4">&larr; View Available
                                Tutors</a>
                            <button type="submit" class="btn btn-success btn-lg px-4 shadow-sm">Request Session</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </main>
    <!-- main page area ends-->

    <!-- Bootstrap 5.3 JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
        crossorigin="anonymous"></script>
</body>

</html>
